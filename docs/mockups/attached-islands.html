<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --g1:#1c1c1e; --g2:#2c2c2e; --g3:#3a3a3c; --dim:#8e8e93; --soft:#c7c7cc; --green:#30d158; --red:#ff3b30; --r:14px; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--foreground, #f1f5ff); font: 13px/1.4 "Inter", "Cantarell", system-ui, sans-serif; }
  .list { display: flex; flex-direction: column; gap: 26px; }
  figure { margin: 0; }
  figcaption { margin-top: 9px; }
  figcaption b { display: block; font-size: 13px; }
  figcaption span { color: var(--dim); font-size: 12px; }
  .tag { display:inline-block; font-size:10px; font-weight:700; color:#fff; background:#5e5ce6; border-radius:6px; padding:1px 6px; margin-left:6px; vertical-align:1px; }

  .screen { position: relative; height: 300px; border-radius: 16px; overflow: hidden;
    background:
      radial-gradient(circle at 84% 26%, #d9d6cc 0 38px, transparent 39px),
      radial-gradient(1px 1px at 20% 30%, #fff8 50%, transparent 51%),
      radial-gradient(1px 1px at 60% 18%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 55%, #fff5 50%, transparent 51%),
      linear-gradient(180deg, #121a33 0%, #1d2547 58%, #6b4a3a 100%);
    }
  .win { position:absolute; inset: 0; }
  .win.app { left: 0; right: 0; top: 0; bottom: 0; background: linear-gradient(180deg,#202634,#171b25); }
  .win.app::before { content:""; position:absolute; left:40px; right:40px; top:56px; height:10px; border-radius:5px; background:#ffffff10; box-shadow: 0 22px 0 #ffffff0c, 0 44px 0 #ffffff0c, 0 66px 0 #ffffff08; }

  /* shared island bits */
  .isl { position: absolute; background: #000; color: #fff; display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; gap: 4px; }
  .b { display:flex; align-items:center; gap:6px; height:24px; padding:0 7px; border-radius:12px; font-size:12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .b svg { width: 15px; height: 15px; flex: none; }
  .clock { font-weight: 600; font-size: 13.5px; padding: 0 10px; }
  .ai { color: #fff; font-size: 12px; padding: 0 4px; }
  .dim { color: var(--dim); }
  .dots { display:grid; grid-template-columns: repeat(3,7px); gap: 2px 3px; padding: 0 4px; }
  .dots i { width:7px; height:4px; border-radius:2px; background:#2c2c2e; } .dots i.o{background:#636366} .dots i.a{background:#fff}
  .sep { width:1px; height:14px; background: var(--g3); margin: 0 2px; }
  .ring { width: 15px; height: 15px; border-radius: 50%; background: conic-gradient(var(--green) 0 90%, #3a3a3c 0); -webkit-mask: radial-gradient(circle, transparent 4.6px, #000 5px); mask: radial-gradient(circle, transparent 4.6px, #000 5px); }
  .song { color: var(--soft); max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .note { color: var(--green); }
  .hair { height: 2px; border-radius: 1px; background: var(--g2); overflow: hidden; }
  .hair i { display:block; height:100%; width: 79%; background: rgba(255,255,255,.9); }

  /* 1 · floating (today) */
  .float { border-radius: 22px; box-shadow: 0 6px 20px rgba(0,0,0,.35); padding: 3px 7px 3px; }
  .float .hair { margin: 1px 6px 0; }

  /* Concave “ears” that blend an island into a screen edge. */
  .ear { position: absolute; width: 14px; height: 14px; }
  .ear.tl { background: radial-gradient(circle at 0 100%, transparent 13.5px, #000 14px); }   /* left of a top-hung island */
  .ear.tr { background: radial-gradient(circle at 100% 100%, transparent 13.5px, #000 14px); } /* right of a top-hung island */
  .ear.bl { background: radial-gradient(circle at 0 0, transparent 13.5px, #000 14px); }       /* left of a bottom-standing island */
  .ear.br { background: radial-gradient(circle at 100% 0, transparent 13.5px, #000 14px); }    /* right of a bottom-standing island / above a left-edge one */

  /* 2 · hung from the top edge */
  .hung { top: 0; left: 50%; transform: translateX(-50%); border-radius: 0 0 20px 20px; padding: 5px 10px 4px; }
  .hung .ear.tl { left: -14px; top: 0; } .hung .ear.tr { right: -14px; top: 0; }
  .hung .hair { margin: 2px 8px 0; }

  /* corner-fused: flush with the bottom-left corner */
  .corner { left: 0; bottom: 0; border-radius: 0 20px 0 0; padding: 6px 10px 6px 10px; }
  .corner .ear.br.up { left: 0; top: -14px; }
  .corner .ear.br.side { right: -14px; bottom: 0; }
  .corner .hair { margin: 3px 4px 0; }

  /* bottom-edge tab: stands on the bottom edge, inset from the corner */
  .tab { left: 18px; bottom: 0; border-radius: 18px 18px 0 0; padding: 5px 9px 5px; }
  .tab .ear.bl { left: -14px; bottom: 0; }
  .tab .ear.br { right: -14px; bottom: 0; }
  .tab .hair { margin: 2px 6px 0; }

  /* hidden lips */
  .lip-top { top: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 5px; border-radius: 0 0 4px 4px; }
  .lip-top .ear { width: 8px; height: 8px; } .lip-top .ear.tl { left:-8px; top:0; background: radial-gradient(circle at 0 100%, transparent 7.5px, #000 8px);} .lip-top .ear.tr{ right:-8px; top:0; background: radial-gradient(circle at 100% 100%, transparent 7.5px, #000 8px);}
  .lip-corner { left: 0; bottom: 0; width: 70px; height: 5px; border-radius: 0 4px 0 0; }
  .lip-corner .ear { width: 8px; height: 8px; right:-8px; bottom:0; background: radial-gradient(circle at 100% 0, transparent 7.5px, #000 8px); }

  /* expanded, still attached */
  .drawer { display:flex; gap: 6px; justify-content: center; padding: 6px 0 4px; font-size: 11px; color: var(--dim); align-items: center; }
  .chip { background: var(--g1); color: #fff; border-radius: 11px; padding: 3px 10px; font-size: 11.5px; }
  .sheet { width: 290px; padding: 12px 12px 8px 12px; gap: 6px; }
  .card { background: var(--g1); border-radius: 14px; padding: 8px; display:flex; align-items:center; gap:10px; }
  .art { width: 38px; height: 38px; border-radius: 8px; background: linear-gradient(135deg,#ff6b6b,#5e5ce6); flex:none; }
  .t1 { font-size: 12.5px; font-weight: 700; } .t2 { font-size: 11.5px; color: var(--dim); }
  .ctl { display:flex; gap: 2px; margin-left: auto; } .ctl span { width: 26px; height: 26px; display:grid; place-items:center; border-radius: 13px; }
  .ctl svg { width: 14px; height: 14px; }
  .slider { height: 24px; border-radius: 12px; background: var(--g2); position: relative; overflow: hidden; flex: 1; }
  .slider i { position:absolute; inset:0 auto 0 0; width: 62%; background:#fff; border-radius: 12px; }
  .slider svg { position:absolute; left: 8px; top: 4px; width: 16px; height: 16px; color: #000; }
  .tiles { display:grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
  .tile { background: var(--g1); border-radius: 13px; padding: 8px 0 6px; display:flex; flex-direction:column; align-items:center; gap:4px; font-size: 10.5px; color: var(--soft); }
  .disc { width: 28px; height: 28px; border-radius: 50%; background: var(--g3); display:grid; place-items:center; color:#fff; }
  .disc svg { width: 14px; height: 14px; }
  .lbl { position:absolute; font-size: 10.5px; color: #ffffffb8; background: #0009; border-radius: 6px; padding: 2px 7px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="power" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 1.8v5.4"/><path d="M4.4 4a5.3 5.3 0 1 0 7.2 0"/></symbol>
  <symbol id="pods" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 10V8a5 5 0 0 1 10 0v2"/><rect x="2" y="9" width="3" height="5" rx="1.2" fill="currentColor"/><rect x="11" y="9" width="3" height="5" rx="1.2" fill="currentColor"/></symbol>
  <symbol id="bell" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5a4 4 0 0 0-4 4v3L2.5 11v1h11v-1L12 8.5v-3a4 4 0 0 0-4-4zM6.5 13a1.5 1.5 0 0 0 3 0z"/></symbol>
  <symbol id="note" viewBox="0 0 16 16" fill="currentColor"><path d="M6 3l7-1.5v9a2 2 0 1 1-1.5-1.9V5L7.5 6v6.5a2 2 0 1 1-1.5-1.9z"/></symbol>
  <symbol id="prev" viewBox="0 0 16 16" fill="currentColor"><path d="M3 3h1.6v10H3zM13 3v10L5.5 8z"/></symbol>
  <symbol id="pause" viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3" width="3" height="10" rx="1"/><rect x="9" y="3" width="3" height="10" rx="1"/></symbol>
  <symbol id="next" viewBox="0 0 16 16" fill="currentColor"><path d="M11.4 3H13v10h-1.6zM3 3v10l7.5-5z"/></symbol>
  <symbol id="vol" viewBox="0 0 16 16"><path fill="currentColor" d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6.3 6.3 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="lock" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="7" rx="2" fill="currentColor" stroke="none"/><path d="M5.2 7V5a2.8 2.8 0 0 1 5.6 0v2"/></symbol>
  <symbol id="moon" viewBox="0 0 16 16" fill="currentColor"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z"/></symbol>
  <symbol id="restart" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 8a5.2 5.2 0 1 1-1.6-3.8"/><path d="M12 1.6v3h-3"/></symbol>
</defs></svg>

<template id="top-row">
  <div class="row">
    <div class="dots"><i class="a"></i><i class="o"></i><i></i><i class="o"></i><i></i><i></i></div>
    <span class="clock">9:06 PM</span><span class="ai">Claude 81%</span><span class="ai">Codex 63%</span>
    <span class="b dim"><svg><use href="#bell"/></svg></span>
  </div>
</template>
<template id="low-row">
  <div class="row">
    <span class="b"><svg><use href="#power"/></svg></span>
    <span class="b"><svg><use href="#pods"/></svg><span class="ring"></span>90%</span>
    <span class="sep"></span>
    <span class="b"><svg class="note"><use href="#note"/></svg><span class="song">Midnight City · M83</span></span>
  </div>
</template>

<div class="list">

  <figure>
    <div class="screen">
      <div class="isl float" style="top:6px;left:50%;transform:translateX(-50%)" data-t="top-row"></div>
      <div class="isl float" style="left:6px;bottom:6px" data-t="low-row" data-hair></div>
    </div>
    <figcaption><b>1 · Today: floating</b><span>Both islands hover 6 px off the edges, with drop shadows. Included for comparison.</span></figcaption>
  </figure>

  <figure>
    <div class="screen">
      <div class="isl hung" data-t="top-row"><i class="ear tl"></i><i class="ear tr"></i></div>
      <div class="isl corner" data-t="low-row" data-hair><i class="ear br up"></i><i class="ear br side"></i></div>
    </div>
    <figcaption><b>2 · Hung notch + corner piece <span class="tag">PICK</span></b><span>The top island hangs from the top edge like a MacBook notch, with curved "ears" blending it into the bezel. The lower island fills the bottom-left corner, square on the two screen sides and rounded only toward the desktop. No shadows: they read as part of the screen's frame.</span></figcaption>
  </figure>

  <figure>
    <div class="screen">
      <div class="isl hung" style="padding-bottom:6px">
        <i class="ear tl"></i><i class="ear tr"></i>
        <div data-t="top-row"></div>
        <div class="drawer">1 · 2 &nbsp; Window <span class="chip">+</span><span class="chip">↻</span><span class="chip">hide</span></div>
      </div>
      <div class="isl corner sheet" style="padding-top:12px">
        <i class="ear br up"></i><i class="ear br side"></i>
        <div class="card"><div class="art"></div><div><div class="t1">Midnight City</div><div class="t2">M83</div></div>
          <div class="ctl"><span><svg><use href="#prev"/></svg></span><span><svg><use href="#pause"/></svg></span><span><svg><use href="#next"/></svg></span></div></div>
        <div class="row" style="gap:8px;padding:0 2px"><div class="slider"><i></i><svg><use href="#vol"/></svg></div><span class="t2" style="width:30px;text-align:right">62%</span></div>
        <div class="tiles">
          <div class="tile"><div class="disc"><svg><use href="#lock"/></svg></div>Lock</div>
          <div class="tile"><div class="disc"><svg><use href="#moon"/></svg></div>Sleep</div>
          <div class="tile"><div class="disc"><svg><use href="#restart"/></svg></div>Restart</div>
          <div class="tile"><div class="disc"><svg><use href="#power"/></svg></div>Shut Down</div>
        </div>
        <div data-t="low-row" style="margin-top:4px"></div>
        <div class="hair" style="margin:2px 4px 0"><i></i></div>
      </div>
    </div>
    <figcaption><b>3 · Attached, expanded</b><span>Opening doesn't spawn a separate popover. The island itself grows: the top one drops its drawer straight down; the corner piece swells up and right into a sheet, with its compact row staying at the bottom where you clicked it.</span></figcaption>
  </figure>

  <figure>
    <div class="screen">
      <div class="isl hung" data-t="top-row"><i class="ear tl"></i><i class="ear tr"></i></div>
      <div class="isl tab" data-t="low-row" data-hair><i class="ear bl"></i><i class="ear br"></i></div>
    </div>
    <figcaption><b>4 · Hung notch + bottom tab</b><span>The lower island stands on the bottom edge, inset 18 px from the corner, with ears on both sides: a mirror of the top notch. More symmetrical, but it no longer uses the corner, so it's less of a fixed target for the mouse.</span></figcaption>
  </figure>

  <figure>
    <div class="screen">
      <div class="isl lip-top"><i class="ear tl"></i><i class="ear tr"></i></div>
      <div class="isl lip-corner"><i class="ear"></i></div>
      <span class="lbl" style="left:50%;top:14px;transform:translateX(-50%)">hidden: a 5 px lip stays in the bezel</span>
      <span class="lbl" style="left:16px;bottom:16px">push into the corner to open</span>
    </div>
    <figcaption><b>5 · Attached, hidden</b><span>With <code>Super+Shift+H</code>, attached islands retract into the bezel and leave a thin black lip where they live, instead of vanishing. That lip shows where to push to peek, and fullscreen apps would still cover it entirely. Shown over the wallpaper here so the lips are visible.</span></figcaption>
  </figure>

</div>
<script>
  // attached-islands.html#2 shows one variation large, for screenshots.
  const only = parseInt(location.hash.slice(1));
  if (only) {
    document.querySelectorAll('figure').forEach((f, i) => { if (i + 1 !== only) f.remove(); });
    document.querySelector('.screen').style.height = '620px';
    document.body.style.padding = '20px 24px';
    document.body.style.background = '#0d0f14';
  }
  for (const el of document.querySelectorAll('[data-t]')) {
    el.append(document.getElementById(el.dataset.t).content.cloneNode(true));
    if ('hair' in el.dataset) { const h = document.createElement('div'); h.className = 'hair'; h.innerHTML = '<i></i>'; el.append(h); }
  }
</script>
</body>
</html>
